[project]
name = "notebooks"
version = "0.1.0"
description = "Practice notebooks"
requires-python = ">=3.12"
dependencies = [
    "jupytext>=1.19.7",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[tool.jupytext]
# Pair every notebook with a plain-text Python script. The .py file is the
# source of truth and is what git tracks; the .ipynb is generated locally.
formats = "ipynb,py:percent"
# Keep the scripts clean: no kernel or tool metadata in the .py files.
notebook_metadata_filter = "-all"
cell_metadata_filter = "-all"
